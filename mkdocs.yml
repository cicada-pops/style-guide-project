site_name: Руководство по стилю SQL Hunt
site_description: Правила написания и оформления документации проекта SQL Hunt
site_url: https://cicada-pops.github.io/style-guide-project/
repo_url: https://github.com/cicada-pops/style-guide-project
repo_name: cicada-pops/style-guide-project
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    anchors: warn

nav:
  - Главная: index.md
  - Правила:
      - Стиль изложения: rules/voice.md
      - Орфография и пунктуация: rules/spelling.md
      - Оформление текста: rules/formatting.md
      - Правила работы с Markdown: rules/markdown.md
      - Точечные рекомендации: rules/recommendations.md
      - Доступность текста: rules/accessibility.md
  - Шаблоны:
      - README: doc-templates/readme.md
      - Инструкция: doc-templates/how-to.md
      - Метод API: doc-templates/api-method.md
      - Описание дела: doc-templates/case.md
  - Словарь и глоссарий: glossary.md
  - Тестирование руководства:
      - Итоги тестирования: examples/index.md
      - "Пример: README SQL Hunt": examples/readme.md
      - "Пример: метод API": examples/execute-sql.md
  - Проверка и линтинг: linting.md
