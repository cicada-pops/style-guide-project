# Настройки Vale для руководства по стилю SQL Hunt.
# Правила лежат в styles/SQLHunt, описание — на странице docs/linting.md.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = SQLHunt

# Заголовки блоков admonition в MkDocs пишутся в прямых кавычках: !!! note "Примечание".
TokenIgnores = (!!! \w+ "[^"]*")
