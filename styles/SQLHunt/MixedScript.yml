# ОП-9. Латиница и кириллица не смешиваются внутри одного слова.
extends: existence
message: "В слове смешаны латиница и кириллица: '%s' (ОП-9)."
link: https://cicada-pops.github.io/style-guide-project/rules/spelling/
level: error
nonword: true
ignorecase: true
tokens:
  - '[а-яё][a-z]|[a-z][а-яё]'
