# ТР-1. Название продукта пишется «SQL Hunt».
# Варианты из двух слов вынесены в ProductNameSpaced.yml: если смешать их
# в одном правиле с вариантами из одного слова, Vale срабатывает нестабильно.
extends: substitution
message: "Название продукта пишется '%s', а не '%s' (ТР-1)."
link: https://cicada-pops.github.io/style-guide-project/rules/recommendations/
level: error
ignorecase: false
swap:
  SQLHunt: SQL Hunt
  SqlHunt: SQL Hunt
  SQL-Hunt: SQL Hunt
