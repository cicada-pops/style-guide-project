# Словарь написания: русские термины и заимствования.
extends: substitution
message: "Пишите '%s' вместо '%s' (словарь написания)."
link: https://cicada-pops.github.io/style-guide-project/glossary/
level: error
ignorecase: true
swap:
  бекенд: бэкенд
  бекэнд: бэкенд
  бэкэнд: бэкенд
  фронтэнд: фронтенд
  e-mail: электронная почта
  имейл: электронная почта
  залогиниться: войти
  разлогиниться: выйти
  учётка: аккаунт
  бранч: ветка
