# СИ-4. Пишите без канцелярита.
extends: existence
message: "Канцелярит: '%s'. Перепишите проще (СИ-4)."
link: https://cicada-pops.github.io/style-guide-project/rules/voice/
level: warning
ignorecase: true
tokens:
  - данн(ый|ая|ое|ого|ой|ом|ую)
  - осуществл[а-яё]*
  - производ(ит|ить|ится|ятся|ят) (настройк|установк|проверк|запуск)[а-яё]*
  - является
  - являются
  - в случае если
  - в целях
  - на сегодняшний день
  - на данный момент
  - имеет возможность
  - имеется возможность
  - в рамках
